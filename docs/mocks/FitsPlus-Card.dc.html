<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600">Phoebus × Salad bowl</span>
<span style="font-size: 13px; color: #4E6A6C">11 Nov</span>
</div>
