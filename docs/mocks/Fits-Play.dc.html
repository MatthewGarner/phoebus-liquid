<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F3A3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>
<span style="font-size: 15px"><b>Whole cat inside.</b> The lid must close.</span>
</div>

<polygon points="300,150 372,186 350,198 278,162" fill="#F2F0EA"></polygon>
<polygon points="278,162 350,198 350,206 278,170" fill="#D8D4CA"></polygon>
<polygon points="195,220 93,271 93,221 195,170" fill="#C4553A"></polygon>
<polygon points="195,220 331,288 331,238 195,170" fill="#B04A32"></polygon>
<polygon points="195,220 331,288 229,339 93,271" fill="#F2E3CC"></polygon>
<g stroke="#DCC7A6" stroke-width="1.5">
<line x1="229" y1="237" x2="127" y2="288"></line>
<line x1="263" y1="254" x2="161" y2="305"></line>
<line x1="297" y1="271" x2="195" y2="322"></line>
<line x1="161" y1="237" x2="297" y2="305"></line>
<line x1="127" y1="254" x2="263" y2="322"></line>
</g>
<g>
<path d="M282 286 q10 -14 22 -10 l6 -10 q6 -2 8 4 l-8 16 q-10 12 -24 8 z" fill="#7FA9C9"></path>
<path d="M300 274 l8 -12" stroke="#5E88A8" stroke-width="3" stroke-linecap="round"></path>

<g>
<circle cx="127" cy="264" r="13" fill="#FFFFFF"></circle>
<path d="M118 260 l8 3 l-3 6 l9 -2 M126 254 l2 6" stroke="#B9C4C3" stroke-width="2" fill="none" stroke-linecap="round"></path>
</g>
<polygon points="195,254 263,288 229,305 161,271" fill="#2E9C8F" opacity="0.28"></polygon>
<polygon points="195,254 263,288 229,305 161,271" fill="none" stroke="#1F7A70" stroke-width="2.5" stroke-dasharray="7 5"></polygon>
<line x1="229" y1="271" x2="195" y2="288" stroke="#1F7A70" stroke-width="1.5" stroke-dasharray="4 4"></line>
<ellipse cx="212" cy="281" rx="40" ry="12" fill="#1F3A3D" opacity="0.18"></ellipse>
<polygon points="93,271 229,339 229,315 93,247" fill="#E06A47"></polygon>
<polygon points="229,339 331,288 331,264 229,315" fill="#C9583D"></polygon>

<path d="M0 -14 q6 12 0 24 M16 -12 q6 12 0 22 M32 -6 q5 10 0 18" stroke="{{stripe}}" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"></path>
<circle cx="-24" cy="-14" r="22" fill="{{coat}}"></circle>

<path d="M260 206 q14 -6 22 -8" stroke="#1F3A3D" stroke-width="2" stroke-dasharray="3 4" fill="none" stroke-linecap="round"></path>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
<button type="button" aria-label="Rotate left" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F3A3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4v6h6"></path><path d="M3.5 10A9 9 0 1 1 6 18"></path></svg>
</button>
<button type="button" style="height: 48px; padding: 0 20px; border-radius: 24px; border: 2px solid #1F3A3D; background: transparent; color: #1F3A3D; display: flex; align-items: center; gap: 8px; font-family: Nunito, sans-serif; font-size: 16px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F3A3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v6M9 6l3 3 3-3M12 21v-6M9 18l3-3 3 3M4 12h16"></path></svg>
Squish · 1 left
</button>
<button type="button" aria-label="Rotate right" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F3A3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4v6h-6"></path><path d="M20.5 10A9 9 0 1 0 18 18"></path></svg>
</button>
</div>
<div style="margin-top: auto; padding: 18px 16px 30px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600">Poses</span>
<span style="font-size: 13px; color: #4E6A6C">Drag one into the box</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{poses}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" style="height: 104px; border-radius: 18px; border: none; background: {{p.bg}}; box-shadow: {{p.ring}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: Nunito, sans-serif; color: {{p.ink}}">
<span style="display: grid; grid-template-columns: repeat(4, 12px); grid-auto-rows: 12px; gap: 2px">
<sc-for list="{{p.cells}}" as="c" hint-placeholder-count="8">
<span style="width: 12px; height: 12px; border-radius: 3px; background: {{c}}"></span>
</sc-for>
</span>
<span style="font-size: 14px; font-weight: 700">{{p.name}}</span>
</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"coat":{"editor":"color","default":"#E08A3C","options":["#E08A3C","#2B2B2E","#9A9AA2","#F2EDE4"]},"stripe":{"editor":"color","default":"#B5612A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const coat = this.props.coat ?? '#E08A3C';
const picked = (this.state && this.state.picked) || 'Loaf';
const off = 'transparent', lock = '#B9C9C8';
const shapes = {
Loaf: [1,1,0,0, 0,0,0,0],
Curl: [1,1,0,0, 1,1,0,0],
Sprawl: [1,1,1,1, 0,0,0,0],
Croissant: [1,0,0,1, 1,1,1,1]
};
const poses = ['Loaf', 'Curl', 'Sprawl', 'Croissant'].map((name) => {
const locked = name === 'Croissant';
const sel = name === picked && !locked;
return {
name: locked ? 'Locked' : name,
cells: shapes[name].map((v) => (v ? (locked ? lock : coat) : off)),
bg: sel ? '#DDEBEA' : '#F2F6F6',
ring: sel ? '0 0 0 3px #1F3A3D' : 'none',
ink: locked ? '#3E5A5C' : '#1F3A3D',
pick: () => { if (!locked) this.setState({ picked: name }); }
};
});
return { coat, stripe: this.props.stripe ?? '#B5612A', poses };
}
}
</script>
</body>
</html>
