<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#DDEBEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liquid">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Liquid: pounce a very squishy tuxedo cat into teacups, vases and delivery boxes. A one-thumb physics game.">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Liquid: a cat in a cup</title>
<style>#boot{position:fixed;inset:0;z-index:200;background:#DDEBEA;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font:700 54px system-ui,sans-serif;color:#1f3a3d;transition:opacity .35s}#boot small{font:600 15px system-ui,sans-serif;color:#4e6a6c}#boot.out{opacity:0;pointer-events:none}#oops{position:fixed;inset:0;z-index:300;background:rgba(31,58,61,.92);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;font:600 20px system-ui,sans-serif;text-align:center;padding:24px}#oops button{font:700 18px system-ui,sans-serif;padding:12px 28px;border-radius:16px;border:0;background:#f0a53a;color:#1f3a3d}</style>
</head>
<body>
<div id="boot">Liquid<small>Loading</small></div>
<div id="oops"><div id="oops-t">Something went wrong.</div><button id="oops-b" type="button">Reload</button></div>
<div id="app"></div>
<div class="rotate-card"><b>Turn me upright</b><span>Phoebus plays in portrait.</span></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
